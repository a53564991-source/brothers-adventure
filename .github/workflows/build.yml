name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Update game files
        run: |
          cp index.html app/src/main/assets/index.html
          printf "%s" "$GITHUB_REPOSITORY" > app/src/main/assets/repository.txt

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Brothers-Adventure-APK
          path: app/build/outputs/apk/debug/*.apk
